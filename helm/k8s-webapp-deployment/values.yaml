namespace: microservice-demo

backend:
  image:
    repository: public.ecr.aws/aws-containers/retail-store-sample-catalog
    tag: "1.4.0"
    pullPolicy: Always
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

frontend:
  image:
    repository: public.ecr.aws/aws-containers/retail-store-sample-ui
    tag: "1.4.0"
    pullPolicy: Always
  replicaCount: 2
  env:
    AWS_REGION: us-east-1
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

ingress:
  # El LBC lee esta anotación para saber que debe crear un ALB
  scheme: internet-facing
  targetType: ip